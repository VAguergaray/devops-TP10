# Source: devops-portfolio/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-portfolio
  labels:
    helm.sh/chart: devops-portfolio-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mi-app
    app.kubernetes.io/version: "1.0.0"
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Va acá (template del pod) para que un cambio fuerce re-deploy
        checksum/config: 6232051e7c17f7f3a483ba788a0f56475df39f98d0dee713b6deb5c5e4ee34eb
        checksum/secret: d5665e38cb7bd4628702a619e5328824af740ea89fb1cf2a5ca266de02ce1dd2
      labels:
        app: backend
        helm.sh/chart: devops-portfolio-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: mi-app
        app.kubernetes.io/version: "1.0.0"
        environment: development
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo "Esperando DB..."; sleep 2; done
      containers:
        - name: backend
          image: "TU_USUARIO/devops-portfolio:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
