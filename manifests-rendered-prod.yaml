apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-portfolio
  labels:
    helm.sh/chart: devops-portfolio-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mi-app
    app.kubernetes.io/version: "1.0.0"
    environment: production
spec:
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Va acá (template del pod) para que un cambio fuerce re-deploy
        checksum/config: c35904390bbdc4b26e472c85b39d9955cb5d57a3887ed325104e216fa04bb720
        checksum/secret: 117ccee72ef1211b72ea32e050b3311007fc382186273b3a6aec370b4e86cb6f
      labels:
        app: backend
        helm.sh/chart: devops-portfolio-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: mi-app
        app.kubernetes.io/version: "1.0.0"
        environment: production
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo "Esperando DB..."; sleep 2; done
      containers:
        - name: backend
          image: "TU_USUARIO/devops-portfolio:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
