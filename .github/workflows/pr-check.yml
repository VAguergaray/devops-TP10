name: PR Check - Validación de Calidad y Helm Chart

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  helm-validation:
    name: Validar y Renderizar Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install PyYAML yamllint

      - name: Validar estructura del Chart
        run: helm lint ./devops-portfolio

      - name: Renderizar desarrollo
        run: |
          helm template mi-app ./devops-portfolio \
            -f values-dev.yaml \
            > manifests-rendered-dev.yaml

      - name: Renderizar producción
        run: |
          helm template mi-app ./devops-portfolio \
            -f values-prod.yaml \
            > manifests-rendered-prod.yaml

      - name: Validar sintaxis YAML
        run: |
          python3 -c "
          import yaml
          with open('manifests-rendered-prod.yaml') as f:
              docs = list(yaml.safe_load_all(f))
              print(f'[OK] Objetos Kubernetes: {len(docs)}')
          "

      - name: Ejecutar yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}}}" manifests-rendered-prod.yaml

      - name: Publicar manifiestos renderizados
        uses: actions/upload-artifact@v4
        with:
          name: manifiestos-k8s-renderizados
          path: |
            manifests-rendered-dev.yaml
            manifests-rendered-prod.yaml
          retention-days: 7
